name: Build and publish

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  schedule:
    # Weekly rebuild to pick up Alpine base-image security patches.
    - cron: "23 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reads the imapsync version straight from the Alpine branch pinned in
      # the Dockerfile's FROM line, so this can't drift if that branch is
      # ever bumped. Same version `apk add imapsync` resolves to moments
      # later in the actual build.
      - name: Read imapsync version
        id: imapsync
        run: |
          branch=$(grep -oP '(?<=^FROM alpine:)[0-9]+\.[0-9]+' Dockerfile)
          version=$(curl -sL "https://dl-cdn.alpinelinux.org/alpine/v${branch}/community/x86_64/APKINDEX.tar.gz" \
            | tar -xzO APKINDEX 2>/dev/null \
            | awk '/^P:imapsync$/{f=1;next} f&&/^V:/{print substr($0,3);exit} /^$/{f=0}')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value={{sha}}
            type=raw,value=${{ steps.imapsync.outputs.version }}

      # Build and load locally first so the vulnerability scan runs before
      # anything is published — a CRITICAL/HIGH finding fails the job here,
      # before the push step below.
      #
      # no-cache on the weekly schedule run: the layer cache would otherwise
      # let `apk add imapsync` (and the base image's own packages) skip
      # re-running forever, since the Dockerfile/digest never change on
      # their own — defeating the whole point of a scheduled rebuild. A
      # fresh apk fetch is the only way this image picks up an imapsync
      # (or Alpine security patch) update without a Dependabot-triggered
      # Dockerfile change. cache-to still runs, so push/PR builds keep
      # using the fast path.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.9
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # Reuses the buildx cache from the build step above for the amd64
      # layers, so this doesn't rebuild those — it just adds an arm64 build
      # (via QEMU) and pushes both.
      # ponytail: only the amd64 build above gets scanned (buildx --load
      # can't load a multi-platform image locally); arm64 uses the same
      # apk package versions so CVE exposure should match. If that ever
      # needs verifying directly, scan with `trivy image --platform
      # linux/arm64 <ref>` against the pushed image.
      - uses: docker/build-push-action@v7
        if: github.event_name != 'pull_request'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
